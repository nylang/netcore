name: macOS Nyra acceptance (compatible self-hosted Mac)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # SDK 1.0.0 has LC_BUILD_VERSION minos 27.0. Never run PR code on this runner.
    runs-on: [self-hosted, macOS, ARM64, nyra-sdk-1.0]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Full Nyra tests with the public SDK
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          out = tempfile.mkdtemp(prefix='net-core-ci-', dir=os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('NET_CORE_OUT=' + out + '\n')
          subprocess.run([sys.executable, 'scripts/ci.py', 'desktop', '--out-dir', out], check=True)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: evidence-macos-nyra
          path: |
            ${{ env.NET_CORE_OUT }}/ci-report.json
            ${{ env.NET_CORE_OUT }}/step-*.log
            ${{ env.NET_CORE_OUT }}/acceptance/*.json
            ${{ env.NET_CORE_OUT }}/acceptance/*.log
          retention-days: 14
